name: Alfredo Secretario

on:
  schedule:
    # 11:40 UTC equivale a 08:40 em America/Sao_Paulo, de segunda a sexta.
    # Minuto quebrado de proposito: horarios cheios (:00) sao os mais
    # disputados no GitHub Actions e costumam atrasar mais.
    - cron: '40 11 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: alfredo-secretario
  cancel-in-progress: false

jobs:
  buscar-vagas:
    name: Buscar vagas e preparar candidaturas
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validar configuracao
        run: |
          if [ -z "${ALFREDO_SECRETARIO_BOT_TOKEN:-$TELEGRAM_BOT_TOKEN}" ]; then
            echo "::error::Configure ALFREDO_SECRETARIO_BOT_TOKEN em Settings > Secrets and variables > Actions."
            exit 1
          fi

          if [ -z "${ALFREDO_SECRETARIO_BOT_CHAT_ID:-$TELEGRAM_CHAT_ID}" ]; then
            echo "::error::Configure ALFREDO_SECRETARIO_BOT_CHAT_ID em Settings > Secrets and variables > Actions."
            exit 1
          fi

          if [ -z "${ALFREDO_SECRETARIO_GEMINI_API_KEY}" ]; then
            echo "::error::Configure ALFREDO_SECRETARIO_GEMINI_API_KEY em Settings > Secrets and variables > Actions."
            exit 1
          fi

          if [ -z "${ALFREDO_SECRETARIO_PERFIL}" ]; then
            echo "::error::Configure ALFREDO_SECRETARIO_PERFIL (perfil do candidato) em Settings > Secrets and variables > Actions."
            exit 1
          fi
        env:
          ALFREDO_SECRETARIO_BOT_TOKEN: ${{ secrets.ALFREDO_SECRETARIO_BOT_TOKEN }}
          ALFREDO_SECRETARIO_BOT_CHAT_ID: ${{ secrets.ALFREDO_SECRETARIO_BOT_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALFREDO_SECRETARIO_GEMINI_API_KEY: ${{ secrets.ALFREDO_SECRETARIO_GEMINI_API_KEY }}
          ALFREDO_SECRETARIO_PERFIL: ${{ secrets.ALFREDO_SECRETARIO_PERFIL }}

      - name: Executar Alfredo Secretario
        run: npm run alfredo:secretario
        env:
          ALFREDO_SECRETARIO_BOT_TOKEN: ${{ secrets.ALFREDO_SECRETARIO_BOT_TOKEN }}
          ALFREDO_SECRETARIO_BOT_CHAT_ID: ${{ secrets.ALFREDO_SECRETARIO_BOT_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALFREDO_SECRETARIO_GEMINI_API_KEY: ${{ secrets.ALFREDO_SECRETARIO_GEMINI_API_KEY }}
          ALFREDO_SECRETARIO_PERFIL: ${{ secrets.ALFREDO_SECRETARIO_PERFIL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}

      # Roda mesmo se o script falhar no meio: as vagas que ja foram enviadas
      # precisam ficar registradas para nao chegarem de novo amanha.
      - name: Versionar historico
        if: success() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -f .github/state/secretario-vagas-history.json ]; then
            echo "Historico ainda nao criado."
            exit 0
          fi

          git add .github/state/secretario-vagas-history.json

          if git diff --cached --quiet; then
            echo "Historico sem alteracoes."
            exit 0
          fi

          git commit -m "Atualiza historico do Alfredo Secretario"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
